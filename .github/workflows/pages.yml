name: site
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', 'kriechstrom/firmware.json', 'tools/make_site.sh']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/make_site.sh
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/site
      - run: sleep 20                            # (a push's artifact is not found by deploy-pages at once)
      - id: deployment
        uses: actions/deploy-pages@v4
