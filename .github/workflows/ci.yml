name: build and test
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Zig 0.13.0, Pillow, fontTools
        run: |
          curl -sSfL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz | tar xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"
          pip3 install --break-system-packages Pillow fonttools
      - name: build
        run: sh tools/build.sh
      - name: tests
        run: sh tests/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kriechstrom
          path: |
            build/kriechstrom.wasm
            build/kriechstrom.zip
